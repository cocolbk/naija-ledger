name: CI

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JS syntax check (ES modules)
        run: |
          for f in js/*.js; do node --input-type=module --check < "$f" || exit 1; done
          echo "All js modules parse."
      - name: Required files present (PRD must never be deleted)
        run: |
          test -f index.html
          test -f styles.css
          test -f js/main.js
          test -f README.md
          test -f IMPLEMENTATION_PLAN.md
          test -f Naija_Ledger_PRD.docx
      - name: No Word lock files tracked
        run: |
          if git ls-files | grep -q '~\$'; then
            echo "Word lock file tracked!"; exit 1;
          fi
      - name: App element IDs referenced in JS exist in HTML
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const html = fs.readFileSync('index.html', 'utf8');
          let ids = [];
          for (const f of fs.readdirSync('js')) {
            if (!f.endsWith('.js')) continue;
            const src = fs.readFileSync(path.join('js', f), 'utf8');
            ids.push(...[...src.matchAll(/getElementById\(\"([^\"]+)\"\)/g)].map(m => m[1]));
          }
          const dynamic = new Set(['ob-next', 'ob-back', 'ob-done', 'ob-monthly', 'ob-error', 'ob-budget-fields', 'sub-manage', 'sub-cancel', 'biz-name', 'biz-type', 'biz-save', 're-export-json', 're-export-csv']); // rendered dynamically
          const missing = [...new Set(ids)].filter(id => !dynamic.has(id) && !html.includes('id=\"' + id + '\"'));
          if (missing.length) { console.error('Missing IDs in index.html:', missing.join(', ')); process.exit(1); }
          console.log('All ' + ids.length + ' referenced IDs present.');
          "
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright + Chromium
        run: |
          npm init -y
          npm i playwright playwright-core
          npx playwright install --with-deps chromium
      - name: Serve static app
        run: |
          nohup python3 -m http.server 8901 --directory . >/tmp/serve.log 2>&1 &
          sleep 2
          curl -sf http://127.0.0.1:8901/index.html > /dev/null
      - name: Headless browser smoke test
        run: node tests/smoke.pw.cjs
        env:
          BASE_URL: http://127.0.0.1:8901
